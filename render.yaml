# Blueprint de Render para el backend (https://render.com/docs/blueprint-spec).
# En Render: New → Blueprint → elegir este repo. Los valores con sync: false
# se piden en el dashboard al crear el servicio (nunca se guardan en el repo).
services:
  - type: web
    name: hospedaje-sebastian-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Solo redespliega cuando cambia el backend (no con cambios del frontend).
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FRONTEND_URL
        value: https://hospedajesebastianfilandia.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospedajesebastianfilandia.com,https://www.hospedajesebastianfilandia.com
      - key: MAIL_FROM
        value: reservas@hospedajesebastianfilandia.com
      - key: JWT_SECRET
        generateValue: true
      # MySQL de Aiven, ej.: jdbc:mysql://HOST:PUERTO/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
