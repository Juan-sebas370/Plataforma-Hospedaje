spring:
  application:
    name: hospedaje-sebastian
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_sebastian?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: hotel_user
    password: hotel_pass123
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:sebastian@gmail.com}
    password: ${MAIL_PASSWORD:jiampi2018*}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.hotelsebasitan: DEBUG

jwt:
  secret: ${JWT_SECRET:HotelSebastian2026-JWTSecureKey-Prod-9f8e7d6c5b4a3210-CHANGE-IN-PRODUCTION}
  expiration: 86400000  # 24 horas (1 día)
  # Opciones de expiración:
  # 3600000    = 1 hora
  # 7200000    = 2 horas  
  # 43200000   = 12 horas
  # 86400000   = 24 horas (1 día) - ACTUAL
  # 604800000  = 7 días (1 semana)
  # 2592000000 = 30 días (1 mes)
