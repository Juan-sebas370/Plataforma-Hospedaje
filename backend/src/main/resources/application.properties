# ====================================
# HOSPEDAJE SEBASTIAN - Configuración
# ====================================

# Nombre de la aplicación
spring.application.name=hospedaje-sebastian

# ====================================
# DATABASE MYSQL
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_sebastian?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=hotel_user
spring.datasource.password=hotel_pass123

# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ====================================
# JACKSON
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ====================================
# EMAIL CONFIGURATION (Gmail)
# ====================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ====================================
# SERVER
# ====================================
server.port=8080
server.servlet.context-path=/api

# ====================================
# LOGGING
# ====================================
logging.level.root=INFO
logging.level.com.hotelsebasitian=DEBUG

# ====================================
# JWT SECURITY
# ====================================
jwt.secret=${JWT_SECRET:HotelSebastian2026-JWTSecureKey-Prod-9f8e7d6c5b4a3210-CHANGE-IN-PRODUCTION}
jwt.expiration=86400000

# Opciones de expiración (milisegundos):
# jwt.expiration=3600000    # 1 hora
# jwt.expiration=7200000    # 2 horas
# jwt.expiration=43200000   # 12 horas
# jwt.expiration=86400000   # 24 horas (ACTUAL)
# jwt.expiration=604800000  # 7 días
# jwt.expiration=2592000000 # 30 días

# ====================================
# NOTAS DE CONFIGURACIÓN
# ====================================
# Base de datos: hotel_sebastian (se crea automáticamente)
# Usuario MySQL: root / root (cambiar en producción)
# Puerto servidor: 3000
# Context path: /api (todas las rutas inician con /api)
# JWT expira en: 24 horas (86400000 ms)
#
# Para variables de entorno:
# - Exporta MAIL_USERNAME con tu email
# - Exporta MAIL_PASSWORD con tu contraseña de aplicación
# - Exporta JWT_SECRET con una clave segura
