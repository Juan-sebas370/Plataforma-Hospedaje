# ====================================
# HOSPEDAJE SEBASTIAN - Configuración
# ====================================

# Nombre de la aplicación
spring.application.name=hospedaje-sebastian

# ====================================
# DATABASE MYSQL
# ====================================
# En producción la plataforma entrega la dirección de MySQL en DB_URL
# (ej.: jdbc:mysql://servidor:3306/hotel_sebastian?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8).
# Sin DB_URL se usa la base local de desarrollo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_sebastian?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:hotel_user}
spring.datasource.password=${DB_PASSWORD:}

# ====================================
# JPA / HIBERNATE
# ====================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ====================================
# JACKSON
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ====================================
# EMAIL CONFIGURATION (Gmail)
# ====================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dirección que aparece como remitente. Con Gmail (SMTP) es la misma cuenta;
# con Resend debe ser del dominio verificado, ej.: reservas@hospedajesebastianfilandia.com
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# En producción (Render bloquea SMTP en el plan gratis) los correos salen por la
# API HTTPS de Resend si se define RESEND_API_KEY. Ver config/MailConfig.java.
resend.api-key=${RESEND_API_KEY:}

# ====================================
# SERVER
# ====================================
# Plataformas como Railway/Render/Fly asignan el puerto por la variable de
# entorno PORT; localmente, sin esa variable, usa 8080.
server.port=${PORT:8080}
server.servlet.context-path=/api

# ====================================
# LOGGING
# ====================================
logging.level.root=INFO
logging.level.com.hotelsebasitian=INFO

# ====================================
# JWT SECURITY
# ====================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Dirección pública de la página web: se usa en los enlaces de los correos
# (recuperación de contraseña). En producción: FRONTEND_URL=https://tu-dominio.com
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# false mientras el hospedaje no esté listo: la API rechaza crear y pagar reservas.
app.reservas.habilitadas=${RESERVAS_HABILITADAS:true}

# ====================================
# WOMPI (pasarela de pagos)
# ====================================
# Sacalas del dashboard de Wompi (sandbox primero, luego producción):
# https://comercios.wompi.co/ → Desarrolladores
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}

# Opciones de expiración (milisegundos):
# jwt.expiration=3600000    # 1 hora
# jwt.expiration=7200000    # 2 horas
# jwt.expiration=43200000   # 12 horas
# jwt.expiration=86400000   # 24 horas (ACTUAL)
# jwt.expiration=604800000  # 7 días
# jwt.expiration=2592000000 # 30 días

# ====================================
# NOTAS DE CONFIGURACIÓN
# ====================================
# Base de datos: hotel_sebastian (se crea automáticamente)
# Usuario MySQL: se configura con DB_USERNAME y DB_PASSWORD
# Puerto servidor: 8080
# Context path: /api (todas las rutas inician con /api)
# JWT expira en: 24 horas (86400000 ms)
#
# Para variables de entorno:
# - Exporta MAIL_USERNAME con tu email
# - Exporta MAIL_PASSWORD con tu contraseña de aplicación
# - Exporta JWT_SECRET con una clave segura
