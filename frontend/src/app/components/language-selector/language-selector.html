<div class="language-selector" (clickOutside)="closeDropdown()">
  <!-- Language Button -->
  <button class="language-btn" (click)="toggleDropdown()" 
    [attr.aria-label]="'Selector de idioma. Idioma actual: ' + getCurrentLanguage().name"
    [attr.title]="getCurrentLanguage().name">
    <img class="flag-icon" [src]="getCurrentLanguage().flag" [alt]="getCurrentLanguage().name + ' flag'" />
    <span class="lang-code">{{ getCurrentLanguage().code.toUpperCase() }}</span>
    <span class="arrow" [class.open]="showDropdown">▼</span>
  </button>

  <!-- Language Dropdown Menu -->
  <div class="language-dropdown" [class.show]="showDropdown" role="menu">
    <!-- Header -->
    <div class="dropdown-header">
      <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span class="header-text">{{ 'languages.selectLanguage' | translate }}</span>
    </div>

    <!-- Language Options -->
    <div class="language-list">
      @for (lang of languages; track lang.code) {
        <button
          class="language-option"
          [class.active]="currentLang === lang.code"
          (click)="selectLanguage(lang.code)"
          [attr.role]="'menuitem'"
          [attr.aria-label]="'Cambiar a ' + lang.name"
        >
          <img class="flag-large" [src]="lang.flag" [alt]="lang.name + ' flag'" />
          <div class="lang-info">
            <span class="code-badge">{{ lang.code.toUpperCase() }}</span>
            <span class="lang-name">{{ lang.name }}</span>
          </div>
          @if (currentLang === lang.code) {
            <span class="checkmark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          }
        </button>
      }
    </div>
  </div>
</div>
