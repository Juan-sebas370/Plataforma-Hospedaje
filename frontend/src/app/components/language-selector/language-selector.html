<div class="language-selector" (clickOutside)="closeDropdown()">
  <!-- Language Button -->
  <button type="button" class="language-btn" (click)="toggleDropdown()"
    [attr.aria-expanded]="showDropdown" aria-controls="lista-idiomas">
    <img class="flag-icon" [src]="getCurrentLanguage().flag" alt="" />
    <span class="sr-only">Idioma: {{ getCurrentLanguage().name }},</span>
    <span class="lang-code">{{ getCurrentLanguage().code.toUpperCase() }}</span>
    <svg class="arrow" [class.open]="showDropdown" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>

  <!-- Language Dropdown Menu -->
  <div id="lista-idiomas" class="language-dropdown" [class.show]="showDropdown"
    role="group" [attr.aria-label]="'common.selectLanguage' | translate">
    @for (lang of languages; track lang.code) {
      <button
        class="language-option"
        [class.active]="currentLang === lang.code"
        (click)="selectLanguage(lang.code)"
        type="button"
        [attr.aria-current]="currentLang === lang.code ? 'true' : null"
        [attr.lang]="lang.code"
      >
        <img class="flag-small" [src]="lang.flag" alt="" />
        <span class="lang-name">{{ lang.name }}</span>
        @if (currentLang === lang.code) {
          <svg class="checkmark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        }
      </button>
    }
  </div>
</div>
