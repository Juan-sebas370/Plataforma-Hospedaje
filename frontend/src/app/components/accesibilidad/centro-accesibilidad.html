<button #boton type="button" class="disparador"
        [class.disparador--activo]="a11y.cantidadActivas() > 0"
        [attr.aria-expanded]="abierto()"
        aria-controls="panel-accesibilidad"
        (click)="alternarPanel()">
  <app-icono name="accesibilidad" [size]="20" [stroke]="2" />
  <span class="disparador__texto">{{ 'a11y.boton' | translate }}</span>
  @if (a11y.cantidadActivas() > 0) {
    <span class="disparador__contador">{{ a11y.cantidadActivas() }}<span class="sr-only"> {{ 'a11y.activos' | translate }}</span></span>
  }
</button>

@if (abierto()) {
  <section #panel id="panel-accesibilidad" class="panel" tabindex="-1"
           aria-labelledby="titulo-accesibilidad" (focusout)="alPerderFoco($event)">
    <header class="panel__cabecera">
      <span class="panel__icono"><app-icono name="accesibilidad" [size]="22" [stroke]="2" /></span>
      <div>
        <h2 id="titulo-accesibilidad">{{ 'a11y.boton' | translate }}</h2>
        <p>{{ 'a11y.sub' | translate }}</p>
      </div>
      <button type="button" class="panel__cerrar" (click)="cerrar(true)" [attr.aria-label]="'a11y.cerrar' | translate">
        <app-icono name="close" [size]="18" [stroke]="2.2" />
      </button>
    </header>

    <div class="panel__cuerpo">
      <!-- Tamaño del texto -->
      <section class="grupo" aria-labelledby="g-texto">
        <h3 id="g-texto">{{ 'a11y.tamano' | translate }}</h3>
        <div class="texto" role="group" aria-labelledby="g-texto">
          <button type="button" (click)="a11y.cambiarTexto(-1)" [disabled]="!a11y.puedeDisminuir()">
            <app-icono name="texto-menos" [size]="18" [stroke]="2" /> <span>{{ 'a11y.reducir' | translate }}</span>
          </button>
          <button type="button" class="texto__valor" (click)="a11y.textoNormal()"
                  [attr.aria-label]="'a11y.actual' | translate: { n: a11y.porcentajeTexto() }">
            {{ a11y.porcentajeTexto() }} %
          </button>
          <button type="button" (click)="a11y.cambiarTexto(1)" [disabled]="!a11y.puedeAumentar()">
            <app-icono name="texto-mas" [size]="18" [stroke]="2" /> <span>{{ 'a11y.aumentar' | translate }}</span>
          </button>
        </div>
      </section>

      @for (g of grupos; track g.titulo) {
        <section class="grupo" [attr.aria-label]="g.titulo | translate">
          <h3>{{ g.titulo | translate }}</h3>
          <div class="opciones">
            @for (o of g.opciones; track o.id) {
              <button type="button" class="opcion"
                      [class.opcion--activa]="a11y.preferencias()[o.id]"
                      [attr.aria-pressed]="a11y.preferencias()[o.id]"
                      [attr.aria-describedby]="'ayuda-' + o.id"
                      (click)="a11y.alternar(o.id)">
                <span class="opcion__icono"><app-icono [name]="o.icono" [size]="20" [stroke]="1.9" /></span>
                <span class="opcion__titulo">{{ o.titulo | translate }}</span>
                <span class="opcion__estado" aria-hidden="true">
                  @if (a11y.preferencias()[o.id]) { <app-icono name="check" [size]="11" [stroke]="3.2" /> {{ 'a11y.activo' | translate }} } @else { {{ 'a11y.inactivo' | translate }} }
                </span>
                <span class="sr-only" [id]="'ayuda-' + o.id">{{ o.ayuda | translate }}</span>
              </button>
            }
          </div>
        </section>
      }
    </div>

    <footer class="panel__pie">
      <button type="button" class="restablecer" (click)="a11y.restablecer()" [disabled]="!a11y.hayCambios()">
        <app-icono name="restablecer" [size]="16" [stroke]="2" /> {{ 'a11y.restablecer' | translate }}
      </button>
      <p class="nota">
        <app-icono name="teclado" [size]="14" />
        <span [innerHTML]="'a11y.teclado' | translate: { teclas: '<kbd>Tab</kbd>, <kbd>Enter</kbd>, <kbd>Esc</kbd>' }"></span>
      </p>
    </footer>
  </section>
}
